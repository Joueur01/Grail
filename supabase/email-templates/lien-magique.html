<!-- Grail · e-mail « Lien de connexion » — à coller dans Supabase : Authentication → Emails → Magic link.
     Objet conseillé : Ton lien de connexion Grail
     Supabase remplace la variable du bouton par le lien personnel du joueur. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f0f11" style="background:#0f0f11;margin:0;padding:0;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <a href="https://huntgrail.eu" style="text-decoration:none;">
              <img src="https://huntgrail.eu/assets/brand/logo-email.png" width="288" height="80" alt="GRAIL" style="display:block;border:0;width:288px;height:80px;">
            </a>
          </td>
        </tr>
        <tr>
          <td bgcolor="#1a1a1e" style="background:#1a1a1e;border-radius:20px;padding:32px 28px;font-family:Arial,Helvetica,sans-serif;color:#f2f1ee;">
            <h1 style="margin:0 0 14px;font-size:24px;line-height:1.2;font-weight:900;color:#f2f1ee;">Connexion à Grail</h1>
            <p style="margin:0 0 26px;font-size:16px;line-height:1.5;color:#c9c7c1;">Touche le bouton pour te connecter à ton compte Grail.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
              <tr>
                <td bgcolor="#f2f1ee" style="background:#f2f1ee;border-radius:999px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 30px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;color:#0f0f11;text-decoration:none;border-radius:999px;">Me connecter</a>
                </td>
              </tr>
            </table>
            <p style="margin:26px 0 0;font-size:13px;line-height:1.5;color:#8d8b86;">Ce lien n'est valable qu'une fois et pour peu de temps. Tu n'as rien demandé ? Ignore cet e-mail.</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-top:22px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#6f6d69;">
            Grail · jeu gratuit de tenues à collectionner · <a href="https://huntgrail.eu" style="color:#8d8b86;">huntgrail.eu</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
