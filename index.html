<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover : permet d'utiliser les zones « encoche » des iPhone.
       maximum-scale=1 / user-scalable=no : la page s'ouvre toujours à 100 %
       et ne zoome pas (comme une appli). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f11">
  <meta name="description" content="Ouvre des boosters de vêtements en pixel art, collectionne, habille ton avatar et partage ta tenue.">
  <title>Grail</title>
  <!-- Seule dépendance externe : la police Archivo (texte normal + titres « étirés »).
       L'interface est moderne et nette ; seuls les vêtements et l'avatar sont en pixel art. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <!-- ?v=… : numéro de version à augmenter à chaque mise en ligne,
       pour forcer les navigateurs (Safari surtout) à recharger les fichiers
       au lieu de garder l'ancienne version en cache. -->
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">GRAIL</h1>
    <!-- Visible seulement avec ?debug=1 -->
    <span class="debug-badge" id="debug-badge" hidden>Debug</span>
  </header>

  <main>
    <!-- Chaque écran est une <section data-screen="…">. main.js n'en affiche qu'un à la fois. -->
    <section class="screen" data-screen="booster" id="screen-booster">
      <!-- Vue 1 : le paquet fermé -->
      <div class="booster-view" id="booster-closed">
        <span class="eyebrow booster-eyebrow">Drop du jour · 3 pièces</span>
        <!-- Le booster lui-même sert de bouton : on le touche pour l'ouvrir.
             Image native 32×48, agrandie d'un facteur entier pour rester nette. -->
        <button class="booster-pack" id="btn-open-booster" aria-label="Ouvrir le booster" disabled>
          <img class="pixel" src="assets/ui/booster.png" width="32" height="48" alt="">
        </button>
        <p class="muted booster-status" id="booster-status">Chargement…</p>
      </div>

      <!-- Vue 2 : les 3 cartes tirées, révélées une par une (booster.js) -->
      <div class="booster-view" id="booster-opened" hidden>
        <span class="eyebrow booster-eyebrow">Ton drop</span>
        <div class="card-row" id="booster-result"></div>
        <button class="btn btn-primary" id="btn-booster-done" hidden>Continuer</button>
      </div>
    </section>

    <section class="screen" data-screen="collection" id="screen-collection" hidden>
      <h2 class="screen-title">Collection</h2>
      <p class="muted" id="collection-summary">—</p>
      <!-- Filtres : menus natifs du téléphone, faciles au doigt. Restent collés en haut. -->
      <div class="filters">
        <select id="filter-brand" aria-label="Filtrer par marque"><option value="">Marque</option></select>
        <select id="filter-category" aria-label="Filtrer par catégorie"><option value="">Type</option></select>
        <select id="filter-rarity" aria-label="Filtrer par rareté"><option value="">Rareté</option></select>
      </div>
      <p class="muted collection-empty" id="collection-empty" hidden></p>
      <!-- Grille des cartes possédées (inventory.js) -->
      <div class="card-grid" id="collection-grid"></div>
    </section>

    <section class="screen" data-screen="avatar" id="screen-avatar" hidden>
      <h2 class="screen-title">Ma tenue</h2>
      <!-- Le canvas est en 32×32 « logique » agrandi ×8 en CSS (facteur entier) -->
      <div class="stage">
        <canvas id="avatar-canvas" class="pixel avatar-canvas" width="32" height="32"></canvas>
      </div>
      <button class="btn" id="btn-share" disabled>Partager ma tenue</button>
    </section>
  </main>

  <!-- Barre d'onglets en bas : à portée de pouce -->
  <nav class="tabbar" aria-label="Navigation">
    <a class="tab" href="#booster" data-tab="booster">Booster</a>
    <a class="tab" href="#collection" data-tab="collection">Collection</a>
    <a class="tab" href="#avatar" data-tab="avatar">Tenue</a>
  </nav>

  <script type="module" src="js/main.js?v=12"></script>
</body>
</html>
