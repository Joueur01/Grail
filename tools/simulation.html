<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grail · simulation des boosters</title>
  <!-- Page d'outil, HORS JEU : elle n'est liée nulle part dans le jeu. -->
  <style>
    body { margin: 0; padding: 16px; background: #0d0d10; color: #f2f1ee; font: 14px/1.5 system-ui, sans-serif; }
    button { padding: 10px 18px; border: 0; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer; }
    pre { overflow-x: auto; white-space: pre; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Simulation des boosters</h1>
  <p>Ouvre 100 000 boosters gratuits avec les règles et la config du jeu (js/economy-config.js).</p>
  <button id="run">Relancer</button>
  <pre id="out">Calcul…</pre>
  <script type="module">
    import { simulate } from "./simulation.js?v=31";
    const out = document.getElementById("out");
    const run = () => {
      out.textContent = "Calcul…";
      setTimeout(() => { out.textContent = simulate(100000); }, 30);
    };
    document.getElementById("run").addEventListener("click", run);
    run();
  </script>
</body>
</html>
